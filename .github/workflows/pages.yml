# Builds the site and publishes it to GitHub Pages on every push to main.
# Needs: Settings → Pages → Source = "GitHub Actions". The production Convex
# URL is below; a repository variable VITE_CONVEX_URL overrides it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Not a secret: it ships inside the built JS. The repo variable wins if set.
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://acoustic-spider-927.convex.cloud' }}
      # Pages has no SPA fallback: serve the app for deep links like /families/x.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
